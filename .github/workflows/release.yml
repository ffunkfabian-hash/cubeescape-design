name: Release Konzeptblätter
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pakete schnüren
        run: |
          mkdir -p dist
          cd output && zip -qr ../dist/konzeptblaetter-${GITHUB_REF_NAME}.zip sheets previews && cd ..
          zip -qr dist/prompts-${GITHUB_REF_NAME}.zip docs
      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          name: Konzeptblätter ${{ github.ref_name }}
          body_path: docs/RELEASE.md
          files: dist/*.zip
