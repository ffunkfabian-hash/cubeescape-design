name: Release Konzeptblätter
on:
  push:
    tags: ['claude-v*']
# Release nur per Tag claude-v* (auf Wunsch des Nutzers); keine Tests. Öffentliches Repo: kostet keine Minuten.
# Schätzung 17.10.2026: ~1 min je Lauf × ~1–2 Läufe im Monat.
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pakete schnüren
        run: |
          mkdir -p dist
          cd claude/output && zip -qr ../../dist/claude-konzeptblaetter-${GITHUB_REF_NAME}.zip sheets previews && cd ../..
          zip -qr dist/claude-prompts-${GITHUB_REF_NAME}.zip docs claude/prompts
      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          name: Konzeptblätter ${{ github.ref_name }}
          body_path: docs/RELEASE.md
          files: dist/*.zip
