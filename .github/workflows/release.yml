name: Release Konzeptblätter
on:
  # Release über einen Branch release/claude-<version> (Tags kann die Claude-Sitzung nicht pushen) oder per Hand.
  push:
    branches: ['release/claude-*']
  workflow_dispatch:
# Release nur auf Wunsch des Nutzers; keine Tests. Öffentliches Repo: kostet keine Minuten.
# Schätzung 17.10.2026: ~1 min je Lauf × ~1–2 Läufe im Monat.
# Blätter (*.dc.html), Schriften und Vorschauen sind nicht im Repo: sie werden auf dem Mac gebaut und mit
# `python3 claude/generator/release_assets.py --upload` als zips an dieses Release gehängt (nur auf Wunsch des Nutzers).
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Version bestimmen
        run: echo "VER=claude-v${GITHUB_REF_NAME#release/claude-}" >> "$GITHUB_ENV"
      - name: Pakete schnüren
        run: |
          mkdir -p dist
          zip -qr dist/claude-prompts-${VER}.zip docs claude/prompts
      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: Claude-Konzeptblätter ${{ env.VER }}
          body_path: docs/RELEASE.md
          files: dist/*.zip
