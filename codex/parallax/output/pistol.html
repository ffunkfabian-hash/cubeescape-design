all, Gummi, matter Kunststoff, sparsame funktionale Leuchtelemente. Ein einziges konsistentes 3D-Modell: Isometrie ohne Optik; sechs orthografische Ansichten im gleichen Maßstab; Optik separat mit Halterung; Abzugsdetail. Klare Verbindungen und sichtbarer Abzug mit Bügel. Keine schwebenden Teile, keine ungewollten Durchdringungen, kein Bloom, keine Perspektivverzerrung.", "en": "Cube Escape Cinder P-7; KURZER KEIL · FERSENSTÜTZE · OFFENE MÜNDUNG. Palette #D5CCB8, #858F99, #303844, #F28C28. Futuristic industrial low-poly hard-surface concept sheet. One consistent 3D model: stock, receiver, grip, trigger with guard, seated magazine or energy cell, visible barrel, muzzle and rail. Isometric without optic; six orthographic views at one shared scale; detached modular optic with mounts, trigger detail. Painted and brushed metal, rubber grip, matte polymer, restrained emissive accents. Clear physical connections and silhouette. No floating parts, unintended intersections, bloom, blur, perspective distortion or changing geometry."}</script></body></html>
