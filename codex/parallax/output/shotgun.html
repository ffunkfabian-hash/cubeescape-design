ont-weight="normal" text-anchor="start" >intersections, blur, bloom or perspective distortion.</text><path d="M140 3240H4660" stroke="#34475B" stroke-width="2"/><text x="140" y="3300" font-size="28" fill="#91A3B7" class="body" font-weight="normal" text-anchor="start" >Alle Ansichten aus demselben 3D-Modell, orthografisch, gleicher Maßstab. Gestalterische Referenz, keine Fertigungszeichnung.</text><text x="4660" y="3350" font-size="23" fill="#91A3B7" class="mono" font-weight="normal" text-anchor="end" >CE / 04 / SHOTGUN / A</text></svg><script type="application/json" id="reference-prompts">{"de": "Cube Escape: Breakwater S-2. Form: DOPPELLAUF · BREITER PUMPGRIFF · FÄCHERSCHAFT. Bauteile: Gehäuse, Schaft, Schulterpolster, Griff, Bügel, Abzug, Magazinschacht, Magazin, Magazinboden, Lauf, Mündung, Laufbrücke, Pumpgriff, Pumpgriffrippe, Visierschiene, Visierklemme, Visierfuß, Reflexrahmen, Reflexbrücke, Wartungsplatte, Ladestatus. Palette: #D5CCB8, #858F99, #303844, #F28C28. Low-Poly, modulare Hard-Surface-Konstruktion; lackiertes und gebürstetes Metall, Gummi, matter Kunststoff, sparsame funktionale Leuchtelemente. Ein einziges konsistentes 3D-Modell: Isometrie ohne Optik; sechs orthografische Ansichten im gleichen Maßstab; Optik separat mit Halterung; Abzugsdetail. Klare Verbindungen und sichtbarer Abzug mit Bügel. Keine schwebenden Teile, keine ungewollten Durchdringungen, kein Bloom, keine Perspektivverzerrung.", "en": "Cube Escape Breakwater S-2; DOPPELLAUF · BREITER PUMPGRIFF · FÄCHERSCHAFT. Palette #D5CCB8, #858F99, #303844, #F28C28. Futuristic industrial low-poly hard-surface concept sheet. One consistent 3D model: stock, receiver, grip, trigger with guard, seated magazine or energy cell, visible barrel, muzzle and rail. Isometric without optic; six orthographic views at one shared scale; detached modular optic with mounts, trigger detail. Painted and brushed metal, rubber grip, matte polymer, restrained emissive accents. Clear physical connections and silhouette. No floating parts, unintended intersections, bloom, blur, perspective distortion or changing geometry."}</script></body></html>
